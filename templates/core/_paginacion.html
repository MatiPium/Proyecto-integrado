{% if is_paginated %}
<nav class="pagination-bar" aria-label="Paginación"><span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span><div class="toolbar-actions">{% if page_obj.has_previous %}<a class="btn btn-sm btn-outline-secondary" href="?q={{ request.GET.q|default:''|urlencode }}&amp;page={{ page_obj.previous_page_number }}">Anterior</a>{% endif %}{% if page_obj.has_next %}<a class="btn btn-sm btn-outline-secondary" href="?q={{ request.GET.q|default:''|urlencode }}&amp;page={{ page_obj.next_page_number }}">Siguiente</a>{% endif %}</div></nav>
{% endif %}
