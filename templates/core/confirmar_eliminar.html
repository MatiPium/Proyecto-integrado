{% extends 'base.html' %}
{% block titulo %}Confirmar eliminación{% endblock %}
{% block contenido %}
<section class="card deletion-card"><div class="card-body"><h2>¿Eliminar este registro?</h2><p>Se eliminará <strong>{{ object }}</strong>. Esta acción no se puede deshacer.</p><form method="post">{% csrf_token %}<div class="form-actions"><a class="btn btn-secondary" href="{% url ui_back_route %}">Cancelar</a><button class="btn btn-danger" type="submit">Sí, eliminar</button></div></form></div></section>
{% endblock %}
