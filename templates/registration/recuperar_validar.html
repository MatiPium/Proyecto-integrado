{% extends 'base.html' %}
{% block titulo %}Validar código{% endblock %}
{% block contenido %}<section class="auth-card"><h1>Validar código</h1><p class="auth-lead">Ingresa el código enviado a tu correo.</p><form method="post">{% csrf_token %}<div class="auth-field"><label class="form-label" for="correo-validacion">Correo institucional</label><input id="correo-validacion" type="email" name="email" autocomplete="email" required></div><div class="auth-field"><label class="form-label" for="codigo-validacion">Código de seis dígitos</label><input id="codigo-validacion" name="codigo" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></div><button class="btn btn-primary" type="submit">Validar código</button></form><p class="auth-recovery"><a href="{% url 'recuperar_solicitar' %}">Solicitar otro código</a></p></section>{% endblock %}
