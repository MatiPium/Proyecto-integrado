{% extends 'base.html' %}{% block contenido %}<div class="col-md-6 mx-auto card p-4"><h1 class="h4">Validar código</h1><p>Consulta tu correo. En desarrollo, el código aparece en la consola del servidor.</p><form method="post">{% csrf_token %}<label class="form-label">Correo</label><input class="form-control mb-3" type="email" name="email" required><label class="form-label">Código de seis dígitos</label><input class="form-control mb-3" name="codigo" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required><button class="btn btn-primary">Validar código</button></form><a href="{% url 'recuperar_solicitar' %}">Solicitar otro código</a></div>{% endblock %}
