{% extends 'base.html' %}
{% block titulo %}Nueva contraseña{% endblock %}
{% block contenido %}<section class="auth-card"><h1>Nueva contraseña</h1><p class="auth-lead">Utiliza una clave segura para tu cuenta.</p><form method="post">{% csrf_token %}<div class="auth-field"><label class="form-label" for="password1">Contraseña</label><input id="password1" type="password" name="password1" autocomplete="new-password" minlength="8" required></div><div class="auth-field"><label class="form-label" for="password2">Repetir contraseña</label><input id="password2" type="password" name="password2" autocomplete="new-password" minlength="8" required></div><button class="btn btn-primary" type="submit">Actualizar contraseña</button></form></section>{% endblock %}
