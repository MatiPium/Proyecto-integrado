{% extends 'base.html' %}
{% block titulo %}Recuperar contraseña{% endblock %}
{% block contenido %}<section class="auth-card"><h1>Recuperar acceso</h1><p class="auth-lead">Escribe tu usuario o correo asociado.</p><form method="post">{% csrf_token %}<div class="auth-field"><label class="form-label" for="identidad-recuperacion">Usuario o correo institucional</label><input id="identidad-recuperacion" name="identidad" autocomplete="username" required></div><button class="btn btn-primary" type="submit">Solicitar código</button></form><p class="auth-recovery"><a href="{% url 'login' %}">Volver al inicio de sesión</a></p></section>{% endblock %}
