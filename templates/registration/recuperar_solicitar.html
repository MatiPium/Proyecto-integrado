{% extends 'base.html' %}
{% block titulo %}Recuperar contraseña{% endblock %}
{% block contenido %}<section class="auth-card"><h1>Recuperar acceso</h1><p class="auth-lead">Escribe el correo asociado a tu cuenta.</p><form method="post">{% csrf_token %}<div class="auth-field"><label class="form-label" for="correo-recuperacion">Correo institucional</label><input id="correo-recuperacion" type="email" name="email" autocomplete="email" required></div><button class="btn btn-primary" type="submit">Solicitar código</button></form><p class="auth-recovery"><a href="{% url 'login' %}">Volver al inicio de sesión</a></p></section>{% endblock %}
