<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}SGR{% endblock %} · SGR La Serena</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --ink:#1E2761; --ice:#CADCFC; }
    body { background:#F3F5FA; }
    .navbar { background: var(--ink); }
    .navbar .nav-link, .navbar-brand { color:#fff !important; }
    .navbar .nav-link.active { background:#fff; color:var(--ink) !important; border-radius:6px; }
    .card { border-color:#DCE1EC; }
    .badge-verde { background:#2F8F5B; } .badge-ambar { background:#C98A00; } .badge-rojo { background:#C43D32; }
    .table > :not(caption) > * > * { padding:.6rem .75rem; }
  </style>
</head>
<body>
{% if user.is_authenticated %}
<nav class="navbar navbar-expand-lg mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'inicio' %}">SGR</a>
    <div class="navbar-nav me-auto">
      <a class="nav-link" href="{% url 'actividad_list' %}">Actividades</a>
      <a class="nav-link" href="{% url 'verificacion_list' %}">Verificación</a>
      <a class="nav-link" href="{% url 'compromiso_list' %}">Agenda colectiva</a>
      <a class="nav-link" href="{% url 'reclamo_list' %}">Reclamos</a>
      <a class="nav-link" href="{% url 'indicadores' %}">Indicadores</a>
      <a class="nav-link" href="{% url 'delegacion_list' %}">Administración</a>
    </div>
    <span class="text-white-50 small me-3">{{ user }} · {{ user.rol|default:"sin rol" }}</span>
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}
      <button class="btn btn-sm btn-outline-light">Cerrar sesión</button>
    </form>
  </div>
</nav>
{% endif %}

<div class="container pb-5">
  {% if messages %}{% for m in messages %}
    <div class="alert alert-{{ m.tags|default:'info' }} alert-dismissible fade show">{{ m }}
      <button class="btn-close" data-bs-dismiss="alert"></button></div>
  {% endfor %}{% endif %}
  {% block contenido %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
